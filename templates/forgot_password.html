<!DOCTYPE html>
{%load static %}
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Font Awesome -->
		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
			rel="stylesheet"
		/>
		<!-- Google Fonts -->
		<link
			href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
			rel="stylesheet"
		/>
		<!-- MDB -->
		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/5.0.0/mdb.min.css"
			rel="stylesheet"
		/>
		<title>Kalanso</title>

		<link rel="icon" type="image/png" class="rounded-2"  sizes="16x16" href="{% static 'img/Logo1.png' %}">
	  
		<style>
			@import url("https://fonts.googleapis.com/css2?family=Redressed&family=Merriweather:wght@300;400;700&display=swap");
			.redressed {
				font-family: "Redressed", serif;
			}
			.merriweather {
				font-family: "Merriweather", serif;
			}
		</style>
	</head>
	<style>
		input::placeholder {
  color: #888888; /* remplace par la couleur souhaitée */
  opacity: 1; /* utile sur Firefox car le placeholder est parfois très pâle par défaut */
}

	</style>
	<body style="background: rgba(12, 11, 11, 0.5);">
		<section class="vh-100 redressed" style="background: rgba(33, 32, 32, 0.745);">
			<div class="container h-100">
				<div
					class="row d-flex justify-content-center align-items-center h-100"
				>
					<div class="col-lg-12 col-xl-11">
						<div
							class="card text-light"
							style="border-radius: 25px; background: rgba(21, 21, 21, 0.245);"
						>
							<div class="card-body p-md-5">
								<div class="row justify-content-center">
									<div
										class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1"
									>
										<p
											class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4 text-light"
										>
											Forgot Password
										</p>

										<form class="mx-1 mx-md-4" action="{% url 'forgotpassword' %}" method="post">
											{% csrf_token %}
                                            <div
												class="d-flex flex-row align-items-center mb-4 text-light">
												<i
													class="fas fa-envelope fa-lg me-3 fa-fw text-light"
												></i>
												<div
													class="form-outline flex-fill mb-0 "
												>
													<input style="color: white; opacity: 1;"
														type="email"
														id="email"
														class="form-control "
                                                        name="email"
													/>
													<label
														class="form-label"
														for="email"
														>Your Email</label
													>
												</div>
											</div>

											<div
												class="d-flex justify-content-center mx-4 mb-3 mb-lg-4"
											>
												<button
													type="submit"
													class="btn btn-primary btn-lg"
												>
													Send
												</button>
											</div>
										</form>
										<div
												class="d-flex justify-content-center mx-4 mb-3 mb-lg-4"
											>
												<a
													href="{% url 'login' %}"
													class=""
												>
												< Login Page
									            </a>
											</div>
									</div>
									<!-- <div
										class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2"
									>
										<img
											src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
											class="img-fluid"
											alt="Sample image"
										/>
									</div> -->
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
		
		
		<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
		<script defer>
			{% autoescape off %}
			{% for ms in messages %}
				swal('{{ms|safe}}');
			{% endfor %}
			{% endautoescape %}
		</script>
		<!-- MDB -->
		<script
			type="text/javascript"
			src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/5.0.0/mdb.min.js"
		></script>
	</body>
</html>
